[project]
name = "taxiflow"
version = "0.1.0"
description = "Local batch + streaming data platform on NYC TLC taxi trips (DuckDB, dbt, Redpanda/Kafka, Streamlit)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "duckdb>=1.1,<2",
    "pyarrow>=16",
    "dbt-duckdb>=1.9,<2",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.38", "pandas>=2.2"]
kafka = ["confluent-kafka>=2.5"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
taxiflow = "taxiflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxiflow"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs dbt end to end (slower)"]
