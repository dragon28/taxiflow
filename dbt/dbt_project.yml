name: taxiflow
version: "1.0.0"
config-version: 2
profile: taxiflow
model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  data_dir: "{{ env_var('TAXIFLOW_DATA', '../data') }}"
  max_trip_miles: 200
  max_trip_hours: 6

models:
  taxiflow:
    staging: {+materialized: view, +schema: staging}
    intermediate: {+materialized: table, +schema: intermediate}
    marts: {+materialized: table, +schema: marts}
seeds:
  taxiflow:
    +schema: reference
    taxi_zone_lookup:
      +column_types: {LocationID: integer, Borough: varchar, Zone: varchar, service_zone: varchar}
