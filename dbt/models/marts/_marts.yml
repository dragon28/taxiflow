version: 2
models:
  - name: fct_trips
    description: Valid trips. Grain = one trip.
    columns:
      - name: trip_key
        data_tests: [unique, not_null]
      - name: pu_location_id
        data_tests:
          - relationships: {to: ref('dim_zone'), field: location_id}
      - name: do_location_id
        data_tests:
          - relationships: {to: ref('dim_zone'), field: location_id}
      - name: pickup_date
        data_tests:
          - relationships: {to: ref('dim_date'), field: date_day}
  - name: dim_zone
    columns:
      - name: location_id
        data_tests: [unique, not_null]
  - name: dim_date
    columns:
      - name: date_day
        data_tests: [unique, not_null]
  - name: mart_stream_windows
    columns:
      - name: window_start
        data_tests: [unique, not_null]
